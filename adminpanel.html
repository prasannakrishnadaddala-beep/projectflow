<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VEWIT Super Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080d;--bg2:#090e15;--bg3:#0d1420;--bg4:#111b28;
  --b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.11);--b3:rgba(255,255,255,.18);
  --tx:#eef2f7;--tx2:#8899b0;--tx3:#4a5a70;
  --blue:#5a8cff;--blue2:#3d6de0;--green:#30d158;--red:#ff453a;
  --orange:#ff9f0a;--purple:#a855f7;--cyan:#00d2ff;--pink:#ec4899;
  --r:12px;--rs:8px;--font:'Inter',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue) 25%,var(--purple) 50%,var(--pink) 75%,transparent);z-index:9999}

#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 60% 20%,rgba(90,140,255,.08) 0%,transparent 60%)}
.login-box{background:var(--bg2);border:1px solid var(--b2);border-radius:20px;padding:44px;width:420px;max-width:calc(100vw - 32px);box-shadow:0 32px 64px rgba(0,0,0,.5)}
.login-logo{font-size:26px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#5a8cff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.login-box h1{font-size:20px;font-weight:700;margin-bottom:4px}
.login-sub{color:var(--tx3);font-size:13px;margin-bottom:30px;padding-bottom:24px;border-bottom:1px solid var(--b1)}
.fg{margin-bottom:18px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);padding:11px 14px;font-size:14px;color:var(--tx);font-family:var(--font);outline:none;transition:all .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue);background:var(--bg4)}
.fg textarea{resize:vertical;min-height:80px}
.btn-login{width:100%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;padding:12px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);transition:opacity .2s;margin-top:4px}
.btn-login:hover{opacity:.88}.btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-err{color:var(--red);font-size:13px;margin-top:14px;text-align:center;display:none;background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.2);border-radius:8px;padding:10px}

#app-shell{display:none;flex-direction:column;min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--b1);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tl{display:flex;align-items:center;gap:12px}
.tl-logo{font-size:17px;font-weight:800;letter-spacing:-.6px;background:linear-gradient(135deg,#5a8cff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tl-div{width:1px;height:20px;background:var(--b2)}
.tl-sub{font-size:12px;color:var(--tx3);font-weight:500}
.tr{display:flex;align-items:center;gap:10px}
.badge-super{font-size:10px;font-weight:800;color:var(--orange);background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.25);padding:3px 10px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase}
.tr-email{font-size:12px;color:var(--tx3)}
.btn-out{background:none;border:1px solid var(--b2);color:var(--tx3);font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:var(--font);transition:all .2s}
.btn-out:hover{border-color:var(--red);color:var(--red)}

.shell-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:218px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--b1);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-sec{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;padding:14px 10px 6px}
.nav-sec:first-child{padding-top:6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--rs);cursor:pointer;font-size:13px;color:var(--tx2);transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:var(--font)}
.nav-item:hover{background:var(--bg3);color:var(--tx)}
.nav-item.active{background:rgba(90,140,255,.13);color:var(--blue);font-weight:600}
.ni{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:28px 30px;background:var(--bg)}

.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px;gap:16px;flex-wrap:wrap}
.ph-title{font-size:21px;font-weight:800;letter-spacing:-.5px}
.ph-sub{font-size:13px;color:var(--tx3);margin-top:3px}
.ph-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}

.sg{display:grid;gap:14px;margin-bottom:24px}
.sg4{grid-template-columns:repeat(4,1fr)}.sg3{grid-template-columns:repeat(3,1fr)}.sg2{grid-template-columns:repeat(2,1fr)}
.sc{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:20px 22px;position:relative;overflow:hidden;transition:border-color .2s}
.sc:hover{border-color:var(--b2)}
.sc .acc{position:absolute;top:0;left:0;right:0;height:2px}
.sc .si{font-size:22px;margin-bottom:10px}
.sc .sl{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.sc .sv{font-size:28px;font-weight:800;letter-spacing:-1.2px;color:var(--tx);line-height:1}
.sc .ss{font-size:11.5px;color:var(--tx3);margin-top:5px}
.pb{height:4px;background:var(--b1);border-radius:4px;overflow:hidden;margin-top:8px}
.pf{height:100%;border-radius:4px;transition:width .5s ease}

.tw{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.tt{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--b1);gap:10px;flex-wrap:wrap}
.tt-title{font-size:13.5px;font-weight:700;color:var(--tx)}
.tc{font-size:11px;color:var(--tx3);margin-left:6px}
.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.si-input{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);padding:7px 12px;font-size:13px;color:var(--tx);font-family:var(--font);outline:none;width:210px;transition:all .2s}
.si-input:focus{border-color:var(--blue);width:250px}
.tbl-select{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);padding:7px 12px;font-size:12px;color:var(--tx2);font-family:var(--font);cursor:pointer;outline:none}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--b1)}
th{font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;padding:10px 14px;text-align:left;white-space:nowrap}
td{padding:12px 14px;font-size:13px;color:var(--tx2);border-bottom:1px solid rgba(255,255,255,.025)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.018)}
.tdm{color:var(--tx);font-weight:600;font-size:13px}
.tds{font-size:11px;color:var(--tx3);margin-top:2px}

.badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.03em;white-space:nowrap}
.bg-green{background:rgba(48,209,88,.12);color:var(--green);border:1px solid rgba(48,209,88,.2)}
.bg-blue{background:rgba(90,140,255,.12);color:var(--blue);border:1px solid rgba(90,140,255,.2)}
.bg-orange{background:rgba(255,159,10,.12);color:var(--orange);border:1px solid rgba(255,159,10,.2)}
.bg-red{background:rgba(255,69,58,.12);color:var(--red);border:1px solid rgba(255,69,58,.2)}
.bg-purple{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.2)}
.bg-cyan{background:rgba(0,210,255,.12);color:var(--cyan);border:1px solid rgba(0,210,255,.2)}
.bg-gray{background:rgba(255,255,255,.06);color:var(--tx3);border:1px solid var(--b1)}
.bg-pink{background:rgba(236,72,153,.12);color:var(--pink);border:1px solid rgba(236,72,153,.2)}

.ab{background:none;border:1px solid var(--b1);color:var(--tx3);font-size:11px;padding:4px 9px;border-radius:5px;cursor:pointer;font-family:var(--font);transition:all .18s;margin-right:3px;white-space:nowrap}
.ab:hover{border-color:var(--blue);color:var(--blue);background:rgba(90,140,255,.07)}
.ab.dng:hover{border-color:var(--red);color:var(--red);background:rgba(255,69,58,.07)}
.ab.suc:hover{border-color:var(--green);color:var(--green);background:rgba(48,209,88,.07)}
.ab.wrn:hover{border-color:var(--orange);color:var(--orange);background:rgba(255,159,10,.07)}
.ab.pur:hover{border-color:var(--purple);color:var(--purple);background:rgba(168,85,247,.07)}
.bsm{font-size:12px;padding:6px 14px;border-radius:6px;border:1px solid var(--b2);background:none;color:var(--tx2);cursor:pointer;font-family:var(--font);transition:all .2s}
.bsm:hover{background:var(--bg3);color:var(--tx)}
.bpri{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;padding:8px 18px;border-radius:var(--rs);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:opacity .2s}
.bpri:hover{opacity:.85}

.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.mo.open{display:flex}
.mc{background:var(--bg2);border:1px solid var(--b2);border-radius:18px;padding:28px;width:520px;max-width:calc(100vw - 28px);max-height:88vh;overflow-y:auto;box-shadow:0 32px 64px rgba(0,0,0,.6)}
.mh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.mc h2{font-size:16px;font-weight:800;letter-spacing:-.3px}
.mclose{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:18px;padding:0 4px;line-height:1}
.mclose:hover{color:var(--tx)}
.mdesc{font-size:13px;color:var(--tx3);margin-bottom:20px;line-height:1.6}
.mact{display:flex;gap:10px;margin-top:22px;justify-content:flex-end}
.bcan{background:none;border:1px solid var(--b2);color:var(--tx2);font-size:13px;padding:8px 18px;border-radius:var(--rs);cursor:pointer;font-family:var(--font);transition:all .2s}
.bcan:hover{color:var(--tx);border-color:var(--b3)}
.bcon{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;font-size:13px;font-weight:700;padding:8px 20px;border-radius:var(--rs);cursor:pointer;font-family:var(--font);transition:opacity .2s}
.bcon:hover{opacity:.85}
.bcon.bdng{background:linear-gradient(135deg,#ff453a,#cc2222)}
.bcon.bwrn{background:linear-gradient(135deg,#ff9f0a,#cc7a00)}
.bcon.bpur{background:linear-gradient(135deg,var(--purple),#7c3aed)}
.mfg{margin-bottom:16px}
.mfg label{display:block;font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.mfg input,.mfg select,.mfg textarea{width:100%;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);padding:10px 13px;font-size:13.5px;color:var(--tx);font-family:var(--font);outline:none;transition:all .2s}
.mfg input:focus,.mfg select:focus,.mfg textarea:focus{border-color:var(--blue);background:var(--bg4)}
.mfg textarea{resize:vertical;min-height:90px}
.mhint{font-size:11.5px;color:var(--tx3);margin-top:5px}
.mfg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.scard{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);margin-bottom:18px}
.scard-h{padding:14px 18px;border-bottom:1px solid var(--b1);font-size:13.5px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.scard-b{padding:18px}
.ir{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.025);font-size:13px;gap:10px}
.ir:last-child{border-bottom:none}
.il{color:var(--tx3);font-size:12px;flex-shrink:0}
.iv{color:var(--tx);font-weight:500;text-align:right;font-size:13px}

.ws-hero{background:linear-gradient(135deg,rgba(90,140,255,.1),rgba(168,85,247,.08));border:1px solid rgba(90,140,255,.18);border-radius:var(--r);padding:20px 22px;margin-bottom:20px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ws-av{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0}
.ws-info h2{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:5px}
.ws-info p{font-size:12.5px;color:var(--tx3);line-height:1.7}
.ws-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--b1);color:var(--tx3);font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:var(--font);transition:all .2s;margin-bottom:18px}
.back-btn:hover{border-color:var(--b2);color:var(--tx)}

/* flag toggles */
.flag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:4px 0}
.flag-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);padding:10px 14px}
.flag-label{font-size:13px;color:var(--tx2)}
.flag-toggle{position:relative;width:34px;height:20px;flex-shrink:0}
.flag-toggle input{opacity:0;width:0;height:0;position:absolute}
.flag-track{position:absolute;inset:0;background:var(--b2);border-radius:10px;cursor:pointer;transition:background .2s}
.flag-toggle input:checked + .flag-track{background:var(--blue)}
.flag-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s;pointer-events:none}
.flag-toggle input:checked ~ .flag-knob{transform:translateX(14px)}

/* usage cards */
.usage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.uc{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);padding:14px;text-align:center}
.uc-v{font-size:22px;font-weight:800;letter-spacing:-1px;color:var(--tx)}
.uc-l{font-size:10.5px;color:var(--tx3);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}

.toast{position:fixed;bottom:22px;right:22px;background:var(--bg3);border:1px solid var(--b2);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--tx);z-index:9000;transform:translateY(80px);opacity:0;transition:all .3s;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.show{transform:translateY(0);opacity:1}
.toast.tok{border-color:rgba(48,209,88,.3);color:var(--green)}
.toast.terr{border-color:rgba(255,69,58,.3);color:var(--red)}
.toast.twrn{border-color:rgba(255,159,10,.3);color:var(--orange)}

.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .ei{font-size:36px;margin-bottom:12px}
.empty p{font-size:14px;line-height:1.6}
.loading{text-align:center;padding:48px;color:var(--tx3);font-size:13px}
.loading::after{content:'';display:inline-block;width:14px;height:14px;border:2px solid var(--b2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin-left:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.hdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0}
.hdot.g{background:var(--green);box-shadow:0 0 6px var(--green)}
.hdot.r{background:var(--red);box-shadow:0 0 6px var(--red)}
.hdot.o{background:var(--orange);box-shadow:0 0 6px var(--orange)}

.ab-login{background:rgba(48,209,88,.1);color:var(--green);border:1px solid rgba(48,209,88,.2)}
.ab-logout{background:rgba(255,255,255,.06);color:var(--tx3);border:1px solid var(--b1)}
.ab-delete,.ab-suspend{background:rgba(255,69,58,.1);color:var(--red);border:1px solid rgba(255,69,58,.2)}
.ab-reset{background:rgba(255,159,10,.1);color:var(--orange);border:1px solid rgba(255,159,10,.2)}
.ab-plan{background:rgba(168,85,247,.1);color:var(--purple);border:1px solid rgba(168,85,247,.2)}
.ab-add{background:rgba(90,140,255,.1);color:var(--blue);border:1px solid rgba(90,140,255,.2)}
.ab-2fa{background:rgba(0,210,255,.1);color:var(--cyan);border:1px solid rgba(0,210,255,.2)}

.chip{display:inline-flex;align-items:center;justify-content:center;border-radius:7px;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}

/* broadcast */
.bc-tip{background:rgba(90,140,255,.07);border:1px solid rgba(90,140,255,.15);border-radius:var(--rs);padding:12px 16px;font-size:12.5px;color:var(--tx2);margin-bottom:18px;line-height:1.7}

/* impersonate banner */
.imp-banner{background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.25);border-radius:var(--rs);padding:10px 14px;font-size:12.5px;color:var(--orange);margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* create-ws steps */
.step-row{display:flex;gap:8px;margin-bottom:22px}
.step-dot{width:24px;height:24px;border-radius:50%;background:rgba(90,140,255,.15);border:1px solid rgba(90,140,255,.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--blue);flex-shrink:0;margin-top:1px}
.step-body{flex:1}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px}
.step-body p{font-size:12px;color:var(--tx3);line-height:1.6}

@media(max-width:900px){
  .sidebar{display:none}.sg4{grid-template-columns:repeat(2,1fr)}
  .sg3{grid-template-columns:repeat(2,1fr)}.main{padding:16px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">VEWIT</div>
    <h1>Super Admin Panel</h1>
    <p class="login-sub">Restricted access — all actions are logged and monitored.</p>
    <div class="fg">
      <label>Admin Email</label>
      <input type="email" id="l-email" placeholder="admin@vewit.in" autocomplete="username"/>
    </div>
    <div class="fg">
      <label>Password</label>
      <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="btn-login" id="l-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="l-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app-shell">
  <div class="topbar">
    <div class="tl">
      <div class="tl-logo">VEWIT</div>
      <div class="tl-div"></div>
      <div class="tl-sub">Super Admin Console</div>
    </div>
    <div class="tr">
      <div class="badge-super">Super Admin</div>
      <div class="tr-email" id="admin-email-display"></div>
      <button class="btn-out" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="shell-body">
    <div class="sidebar">
      <div class="nav-sec">Overview</div>
      <button class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
        <span class="ni">📊</span> Dashboard
      </button>
      <button class="nav-item" onclick="showPage('workspaces')" id="nav-workspaces">
        <span class="ni">🏢</span> Workspaces
      </button>
      <button class="nav-item" onclick="showPage('users')" id="nav-users">
        <span class="ni">👥</span> All Users
      </button>
      <div class="nav-sec">Management</div>
      <button class="nav-item" onclick="showPage('enterprise')" id="nav-enterprise">
        <span class="ni">🌐</span> Enterprise
      </button>
      <button class="nav-item" onclick="showPage('security')" id="nav-security">
        <span class="ni">🔐</span> Security & 2FA
      </button>
      <button class="nav-item" onclick="showPage('billing')" id="nav-billing">
        <span class="ni">💳</span> Plans & Billing
      </button>
      <button class="nav-item" onclick="showPage('broadcast')" id="nav-broadcast">
        <span class="ni">📣</span> Broadcast
      </button>
      <button class="nav-item" onclick="showPage('audit')" id="nav-audit">
        <span class="ni">📋</span> Audit Log
      </button>

        <span class="ni">⚙️</span> Platform Health
      </button>

</div>

<!-- MODAL -->
<div class="mo" id="mo" onclick="if(event.target===this)closeModal()">
  <div class="mc">
    <div class="mh">
      <h2 id="m-title">Confirm</h2>
      <button class="mclose" onclick="closeModal()">✕</button>
    </div>
    <p class="mdesc" id="m-desc"></p>
    <div id="m-form"></div>
    <div class="mact">
      <button class="bcan" onclick="closeModal()">Cancel</button>
      <button class="bcon" id="m-btn" onclick="modalConfirm()">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
function safeJson(s,fb){try{return JSON.parse(s);}catch(_){return fb!==undefined?fb:[];}}
let TOK=sessionStorage.getItem('v_atk')||'';
let EMAIL=sessionStorage.getItem('v_ae')||'';
let curPage='dashboard';
let mCb=null;
let _ttimer=null;

// ── Boot ─────────────────────────────────────────────────────────────────────
(async function boot(){
  if(EMAIL)_setEmail(EMAIL);
  if(!TOK){_showLogin();return;}
  try{
    const r=await fetch('/api/admin/session',{headers:{'X-Admin-Token':TOK},credentials:'include'});
    if(!r.ok)throw new Error('invalid');
    const d=await r.json().catch(()=>({}));
    EMAIL=d.email||EMAIL;
    sessionStorage.setItem('v_ae',EMAIL);
    _setEmail(EMAIL);
    _showApp();
    showPage('dashboard');
  }catch(e){
    _clearSess();
    _showLogin();
  }
})();

function _setEmail(e){document.getElementById('admin-email-display').textContent=e;}
function _showLogin(){document.getElementById('login-screen').style.display='flex';document.getElementById('app-shell').style.display='none';}
function _showApp(){document.getElementById('login-screen').style.display='none';document.getElementById('app-shell').style.display='flex';}
function _clearSess(){TOK='';EMAIL='';sessionStorage.removeItem('v_atk');sessionStorage.removeItem('v_ae');}

async function doLogin(){
  const email=(document.getElementById('l-email').value||'').trim();
  const pw=document.getElementById('l-pass').value||'';
  const btn=document.getElementById('l-btn');
  const err=document.getElementById('l-err');
  err.style.display='none';
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const r=await fetch('/api/admin/login',{method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){err.textContent=d.error||'Login failed';err.style.display='block';return;}
    TOK=d.token;EMAIL=email;
    sessionStorage.setItem('v_atk',TOK);
    sessionStorage.setItem('v_ae',EMAIL);
    _setEmail(EMAIL);_showApp();showPage('dashboard');
  }catch(e){err.textContent='Network error — is the backend running?';err.style.display='block';}
  finally{btn.disabled=false;btn.textContent='Sign In';}
}

async function doLogout(){
  try{await fetch('/api/admin/logout',{method:'POST',credentials:'include',headers:{'X-Admin-Token':TOK}});}catch(_){}
  _clearSess();_showLogin();
}

async function api(method,path,body){
  const opts={method,credentials:'include',headers:{'X-Admin-Token':TOK}};
  if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
  const r=await fetch('/api/admin'+path,opts);
  if(r.status===401){_clearSess();_showLogin();throw new Error('Unauthorized');}
  return r;
}

function showPage(p){
  curPage=p;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const ni=document.getElementById('nav-'+p);
  if(ni)ni.classList.add('active');
  const fns={dashboard,workspaces,users,enterprise,security,billing,broadcast,audit,health};
  if(fns[p])fns[p]();
}

function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast t'+type;
  clearTimeout(_ttimer);
  setTimeout(()=>t.classList.add('show'),10);
  _ttimer=setTimeout(()=>t.classList.remove('show'),3400);
}

function openModal(title,desc,formHtml,btnLabel,btnStyle,cb){
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-desc').textContent=desc;
  document.getElementById('m-form').innerHTML=formHtml||'';
  const btn=document.getElementById('m-btn');
  btn.textContent=btnLabel||'Confirm';
  btn.className='bcon '+(btnStyle||'');
  mCb=cb;
  document.getElementById('mo').classList.add('open');
}
function closeModal(){document.getElementById('mo').classList.remove('open');mCb=null;}
async function modalConfirm(){if(mCb)await mCb();closeModal();}

function set(h){document.getElementById('main-content').innerHTML=h;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function ts(d){if(!d)return'—';const s=Math.floor((Date.now()-new Date(d))/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function fmt(d){return d?String(d).slice(0,10):'—';}
function roleBadge(r){const m={Admin:'bg-red',Manager:'bg-orange',TeamLead:'bg-purple',Developer:'bg-blue',Tester:'bg-green',Viewer:'bg-gray'};return`<span class="badge ${m[r]||'bg-gray'}">${esc(r)||'—'}</span>`;}
function planBadge(p){const m={starter:'bg-gray',team:'bg-blue',enterprise:'bg-purple'};return`<span class="badge ${m[p]||'bg-gray'}">${esc(p)||'starter'}</span>`;}
function chip(u,size=28){const av=(u.avatar||(u.name||'?')[0]).slice(0,2).toUpperCase();return`<div class="chip" style="width:${size}px;height:${size}px;background:${esc(u.color||'#334')}">${esc(av)}</div>`;}
function auditCls(a){if(!a)return'bg-gray';const l=a.toLowerCase();if(l.includes('login'))return'ab-login';if(l.includes('logout'))return'ab-logout';if(l.includes('delete'))return'ab-delete';if(l.includes('suspend'))return'ab-suspend';if(l.includes('reset'))return'ab-reset';if(l.includes('plan'))return'ab-plan';if(l.includes('add')||l.includes('create')||l.includes('broadcast'))return'ab-add';if(l.includes('2fa')||l.includes('totp'))return'ab-2fa';return'bg-gray';}
function filterTable(inp,id){const q=inp.value.toLowerCase();document.querySelectorAll(`#${id} tbody tr`).forEach(r=>{r.style.display=(r.dataset.search||r.textContent).toLowerCase().includes(q)?'':'none';});}
function bytes(b){if(!b)return'0 B';const u=['B','KB','MB','GB'];let i=0;while(b>=1024&&i<3){b/=1024;i++;}return b.toFixed(1)+' '+u[i];}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
async function dashboard(){
  set('<div class="loading">Loading dashboard</div>');
  try{
    const[dr,wr]=await Promise.all([
      api('GET','/dashboard').then(r=>r.json()),
      api('GET','/workspaces').then(r=>r.json()),
    ]);
    const wsList=wr.workspaces||[];
    const active=wsList.filter(w=>!w.suspended&&!w.deleted_at).length;
    const enterprise=wsList.filter(w=>w.plan==='enterprise').length;
    const team=wsList.filter(w=>w.plan==='team').length;
    set(`
      <div class="ph"><div><div class="ph-title">Dashboard</div><div class="ph-sub">Platform-wide overview</div></div>
        <div class="ph-actions">

      <div class="sg sg4">
        <div class="sc"><div class="acc" style="background:var(--blue)"></div><div class="si">👥</div><div class="sl">Total Users</div><div class="sv">${dr.total_users||0}</div><div class="ss">${dr.active_users||0} active in 7d</div></div>
        <div class="sc"><div class="acc" style="background:var(--purple)"></div><div class="si">🏢</div><div class="sl">Workspaces</div><div class="sv">${dr.total_workspaces||0}</div><div class="ss">${active} active · ${enterprise} enterprise</div></div>
        <div class="sc"><div class="acc" style="background:var(--green)"></div><div class="si">💰</div><div class="sl">Paid Workspaces</div><div class="sv">${team+enterprise}</div><div class="ss">${team} team · ${enterprise} enterprise</div></div>
        <div class="sc"><div class="acc" style="background:var(--orange)"></div><div class="si">📈</div><div class="sl">Revenue</div><div class="sv">₹${((team*499)+(enterprise*0)).toLocaleString()}</div><div class="ss">Monthly estimate</div></div>
      </div>
      <div class="sg sg3">
        <div class="sc"><div class="sl">Starter</div><div class="sv">${wsList.filter(w=>(w.plan||'starter')==='starter').length}</div><div class="pb"><div class="pf" style="background:var(--tx3);width:${Math.min(100,Math.round(wsList.filter(w=>(w.plan||'starter')==='starter').length/(dr.total_workspaces||1)*100))}%"></div></div></div>
        <div class="sc"><div class="sl">Team</div><div class="sv">${team}</div><div class="pb"><div class="pf" style="background:var(--blue);width:${Math.min(100,Math.round(team/(dr.total_workspaces||1)*100))}%"></div></div></div>
        <div class="sc"><div class="sl">Enterprise</div><div class="sv">${enterprise}</div><div class="pb"><div class="pf" style="background:var(--purple);width:${Math.min(100,Math.round(enterprise/(dr.total_workspaces||1)*100))}%"></div></div></div>
      </div>
      <div class="tw">
        <div class="tt"><span class="tt-title">Recent Workspaces</span></div>
        <table><thead><tr><th>Workspace</th><th>Plan</th><th>Members</th><th>Created</th><th>Actions</th></tr></thead><tbody>
        ${wsList.slice(0,8).map(w=>`<tr>
          <td><div class="tdm">${esc(w.name)}</div>${w.subdomain?`<div class="tds">${esc(w.subdomain)}.vewit.in</div>`:''}</td>
          <td>${planBadge(w.plan)}</td>
          <td>${w.member_count||0}</td>
          <td>${fmt(w.created)}</td>
          <td><button class="ab" onclick="viewWorkspace('${esc(w.id)}','${esc(w.name)}')">View →</button></td>
        </tr>`).join('')}
        </tbody></table>
      </div>`);
  }catch(e){set(`<div class="empty"><div class="ei">⚠️</div><p>${esc(e.message)}</p></div>`);}
}

// ── ENTERPRISE ────────────────────────────────────────────────────────────────
async function enterprise(){
  set(`
    <div class="ph"><div><div class="ph-title">Enterprise</div><div class="ph-sub">Onboard customers, manage subdomains & white-label branding</div></div>
      <div class="ph-actions"><button class="bpri" onclick="createWorkspace()">+ Onboard New Customer</button></div>

    <div class="scard" style="margin-bottom:18px">
      <div class="scard-h">🌐 How Subdomain Routing Works</div>

        </div>
      </div>
    </div>`);
}

async function sendBroadcast(){
  const ws_id=document.getElementById('bc-ws').value||null;
  const subject=(document.getElementById('bc-sub').value||'').trim();
  const body=(document.getElementById('bc-body').value||'').trim();
  const res=document.getElementById('bc-result');
  if(!subject||!body){toast('Subject and body are required','err');return;}
  res.textContent='Sending…';
  try{
    const r=await api('POST','/broadcast-email',{workspace_id:ws_id,subject,body});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Failed');
    res.textContent=`✓ Sent ${d.sent}, failed ${d.failed}`;
    toast(`Broadcast sent to ${d.sent} user(s)`,'ok');
  }catch(e){res.textContent='';toast(e.message,'err');}
}

function broadcastToWs(wsId,wsName){
  showPage('broadcast');
  setTimeout(()=>{
    const sel=document.getElementById('bc-ws');
    if(sel){for(const o of sel.options){if(o.value===wsId){o.selected=true;break;}}}
  },200);
}

  openModal('Export Workspace Data',`Download a full JSON export of "${wsName}" including users, tasks, projects, messages, and tickets. Passwords and 2FA secrets are excluded.`,'','Export','',async()=>{
    toast('Generating export…');
    const r=await api('GET',`/workspace/export/${wsId}`);
    if(!r.ok)throw new Error((await r.json()).error||'Failed');
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');

    toast('Export downloaded','ok');

    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Failed');
    const url=window.location.origin+d.login_url;
    // Show link in a new modal-like message
    document.getElementById('m-form').innerHTML=`
      <div class="imp-banner">⚡ One-time link (expires 15 min)</div>
      <div style="background:var(--bg3);border:1px solid var(--b2);border-radius:var(--rs);padding:10px 14px;font-family:monospace;font-size:12px;word-break:break-all;color:var(--cyan)">${esc(url)}</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="bpri" onclick="navigator.clipboard.writeText('${esc(url)}');toast('Copied!','ok')">Copy Link</button>
        <button class="bsm" onclick="window.open('${esc(url)}','_blank')">Open in New Tab</button>
      </div>`;
    document.getElementById('m-btn').style.display='none';
    document.getElementById('m-title').textContent='Impersonation Link Ready';
    document.getElementById('m-desc').textContent='Share this link only with yourself. It logs you in as the user for support purposes.';
    mCb=null;
    _audit&&_audit('impersonate_modal_opened',uid,'');
  });
}

function moveUser(uid,name){
  openModal('Move User to Workspace',`Move "${name}" to a different workspace. Their tasks, messages, and history will remain in the original workspace.`,
    `<div class="mfg"><label>Target Workspace ID</label><input id="mv-ws" placeholder="wsabc123…"/><div class="mhint">Find the workspace ID in the Workspaces table</div></div>`,
    'Move User','',async()=>{
    const newWs=document.getElementById('mv-ws').value.trim();
    if(!newWs){toast('Workspace ID required','err');return;}
    const r=await api('POST',`/users/${uid}/move-workspace`,{new_workspace_id:newWs});
    if(!r.ok)throw new Error((await r.json()).error||'Failed');
    toast(`${name} moved to workspace ${newWs}`,'ok');
  });
}

function setPlan(wsId,wsName){
  openModal('Change Plan',`Set the subscription plan for "${wsName}".`,
    `<div class="mfg"><label>Plan</label><select id="plan-sel"><option value="starter">Starter (Free)</option><option value="team">Team (₹499/mo)</option><option value="enterprise">Enterprise (Custom)</option></select></div>
    <div class="mfg"><label>Max Members</label><input type="number" id="plan-max" min="1" placeholder="e.g. 25"/></div>`,
    'Save Plan','',async()=>{
    const plan=document.getElementById('plan-sel').value;
    const max=parseInt(document.getElementById('plan-max').value)||undefined;
    const r=await api('POST','/workspace/set-plan',{workspace_id:wsId,plan});
    if(!r.ok)throw new Error((await r.json()).error||'Failed');
    if(max){
      await api('POST','/workspace/update',{workspace_id:wsId,max_members:max});
    }
    toast(`Plan set to ${plan}`,'ok');
    if(curPage==='billing')billing();
  });
}

function toggle2FA(wsId,current){
  const enabled=!current;
  openModal(`${enabled?'Enable':'Disable'} 2FA Requirement`,
    `${enabled?'Require':'Remove the requirement for'} Google Authenticator for all users in this workspace?`,'',
    enabled?'Enable 2FA':'Disable 2FA',enabled?'':'bdng',async()=>{
    const r=await api('POST','/workspace/toggle-2fa',{workspace_id:wsId,enabled});
    if(!r.ok)throw new Error((await r.json()).error||'Failed');
    toast(`2FA requirement ${enabled?'enabled':'disabled'}`,'ok');
  });
}

function resetInviteCode(wsId){
  openModal('Reset Invite Code','Generate a new invite code. The old code will immediately stop working.',
    '','Reset Code','bwrn',async()=>{
    const r=await api('POST','/workspace/reset-invite',{workspace_id:wsId});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Failed');
    toast(`New code: ${d.invite_code}`,'ok');
  });
}

function resetAllPw(wsId,wsName){
  openModal('Reset All Passwords',`Set a temporary password for every member of "${wsName}". Tell them to change it on next login.`,
    `<div class="mfg"><label>Temporary Password</label><input type="password" id="rap-pw" placeholder="min 8 chars"/></div>`,
    'Reset All Passwords','bdng',async()=>{
    const pw=document.getElementById('rap-pw').value;
    if(pw.length<8){toast('Min 8 characters','err');return;}
    const r=await api('POST','/workspace/reset-all-passwords',{workspace_id:wsId,password:pw});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Failed');
    toast(`Reset passwords for ${d.count} users`,'wrn');
  });
}

function resetAllTOTP(wsId,wsName){
  openModal('Reset All 2FA',`Clear Google Authenticator for every member of "${wsName}". Users will need to re-enrol.`,'',
    'Reset All 2FA','bdng',async()=>{
    const r=await api('POST','/workspace/reset-all-totp',{workspace_id:wsId});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Failed');
    toast(`2FA cleared for ${d.count} users`,'wrn');
  });
}

function addUser(wsId){
  openModal('Add User to Workspace','Create a new user directly in this workspace.',
    `<div class="mfg"><label>Full Name</label><input id="au-name" placeholder="Ravi Kumar"/></div>
    <div class="mfg"><label>Email</label><input type="email" id="au-email" placeholder="ravi@company.com"/></div>
    <div class="mfg"><label>Temporary Password</label><input type="password" id="au-pw" placeholder="min 8 chars"/></div>
    <div class="mfg"><label>Role</label><select id="au-role"><option>Admin</option><option>Manager</option><option>TeamLead</option><option selected>Developer</option><option>Tester</option><option>Viewer</option></select></div>`,
    'Add User','',async()=>{
    const r=await api('POST','/workspace/add-user',{
      workspace_id:wsId,
      name:document.getElementById('au-name').value,
      email:document.getElementById('au-email').value,
      password:document.getElementById('au-pw').value,
      role:document.getElementById('au-role').value,
    });
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Failed');
    toast('User added','ok');
    viewWorkspace(wsId,'');
  });
}

function resetPw(uid,name){
  openModal(`Reset Password — ${name}`,'',
    `<div class="mfg"><label>New Password</label><input type="password" id="rp-pw" placeholder="min 8 chars"/></div>`,
    'Reset Password','',async()=>{
    const pw=document.getElementById('rp-pw').value;
    if(pw.length<8){toast('Min 8 characters','err');return;}
    const r=await api('POST',`/users/${uid}/reset-password`,{password:pw});
    if(!r.ok)throw new Error((await r.json()).error||'Failed');
    toast(`Password reset for ${name}`,'ok');
  });
}

function resetTOTP(uid,name){
  openModal(`Reset 2FA — ${name}`,`Clear Google Authenticator for ${name}. They will need to re-enrol on next login.`,'',
    'Reset 2FA','bwrn',async()=>{
    const r=await api('POST',`/users/${uid}/reset-totp`,{});
    if(!r.ok)throw new Error((await r.json()).error||'Failed');
    toast(`2FA cleared for ${name}`,'ok');
  });
}

function changeRole(uid,name,current){
  openModal(`Change Role — ${name}`,'',
    `<div class="mfg"><label>Role</label><select id="cr-role">
      ${['Admin','Manager','TeamLead','Developer','Tester','Viewer'].map(r=>`<option ${r===current?'selected':''}>${r}</option>`).join('')}
    </select></div>`,
    'Change Role','',async()=>{
    const role=document.getElementById('cr-role').value;
    const r=await api('POST',`/users/${uid}/change-role`,{role});
    if(!r.ok)throw new Error((await r.json()).error||'Failed');
    toast(`Role changed to ${role}`,'ok');
  });
}

function removeUser(uid,name,wsId){
  openModal(`Delete User — ${name}`,`Permanently delete ${name}. This cannot be undone.`,'','Delete','bdng',async()=>{
    const r=await api('POST',`/users/${uid}/delete`,{workspace_id:wsId});
    if(!r.ok)throw new Error((await r.json()).error||'Failed');
    toast(`${name} deleted`,'wrn');
    if(wsId)viewWorkspace(wsId,'');else users();
  });
}

function createWorkspace(){
  openModal('Onboard New Customer','Create a workspace on behalf of a customer. A temporary password is generated if you leave it blank.',`
    <div class="mfg-row">
      <div class="mfg"><label>Workspace Name *</label><input id="cw-name" placeholder="Acme Corp"/></div>
      <div class="mfg"><label>Plan</label><select id="cw-plan"><option value="starter">Starter</option><option value="team">Team</option><option value="enterprise" selected>Enterprise</option></select></div>
    </div>
    <div class="mfg"><label>Subdomain</label><input id="cw-sub" placeholder="acme"/><div class="mhint">acme.vewit.in — leave blank to use app.vewit.in</div></div>
    <div class="mfg"><label>Admin Email *</label><input type="email" id="cw-email" placeholder="admin@acme.com"/></div>
    <div class="mfg"><label>Admin Name</label><input id="cw-uname" placeholder="Ravi Kumar"/></div>
    <div class="mfg-row">
      <div class="mfg"><label>Temp Password</label><input type="password" id="cw-pw" placeholder="auto-generate if blank"/></div>
      <div class="mfg"><label>Max Members</label><input type="number" id="cw-max" placeholder="25" value="25"/></div>
    </div>
    <div id="cw-result" style="display:none;background:rgba(48,209,88,.08);border:1px solid rgba(48,209,88,.2);border-radius:var(--rs);padding:12px;margin-top:12px;font-size:13px;line-height:1.8"></div>
    `,
    'Create & Onboard','',async()=>{
    const body={
      name:document.getElementById('cw-name').value.trim(),
      plan:document.getElementById('cw-plan').value,
      subdomain:document.getElementById('cw-sub').value.trim()||undefined,
      owner_email:document.getElementById('cw-email').value.trim(),
      owner_name:document.getElementById('cw-uname').value.trim()||undefined,
      owner_password:document.getElementById('cw-pw').value||undefined,
      max_members:parseInt(document.getElementById('cw-max').value)||25,
    };
    if(!body.name||!body.owner_email){toast('Name and email are required','err');return;}
    const r=await api('POST','/workspace/create',body);
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Failed');
    const res=document.getElementById('cw-result');
    res.style.display='block';
    res.innerHTML=`✅ <b>Workspace created!</b><br>
      Workspace ID: <code>${esc(d.workspace_id)}</code><br>
      Login URL: <a href="${esc(d.login_url)}" target="_blank" style="color:var(--cyan)">${esc(d.login_url)}</a><br>
      Invite Code: <code>${esc(d.invite_code)}</code><br>
      Temp Password: <code>${esc(d.temp_password)}</code><br>
      <span style="color:var(--tx3);font-size:11.5px">Share the login URL and temp password with the customer.</span>`;
    document.getElementById('m-btn').textContent='Done';
    mCb=()=>{enterprise();};
    toast('Workspace created successfully','ok');
  });
}
</script>
</body>
</html>

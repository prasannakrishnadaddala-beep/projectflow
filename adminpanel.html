<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VEWIT Admin Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a0f;--bg2:#0d1117;--bg3:#111820;--bg4:#161d27;
  --b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);
  --tx:#f0f4f8;--tx2:#8b9ab0;--tx3:#556070;
  --blue:#5a8cff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;
  --purple:#a855f7;--cyan:#00d2ff;
  --r:12px;--rs:8px;
  --font:'Inter',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}

/* ── TOP BAR ── */
.topbar{background:var(--bg2);border-bottom:1px solid var(--b1);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-logo{font-size:18px;font-weight:800;letter-spacing:-.6px;background:linear-gradient(135deg,#5a8cff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:flex;align-items:center;gap:10px}
.topbar-logo span{font-size:11px;font-weight:600;color:var(--tx3);-webkit-text-fill-color:var(--tx3);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--b2);padding:2px 8px;border-radius:20px}
.topbar-right{display:flex;align-items:center;gap:16px}
.admin-badge{font-size:11px;font-weight:700;color:var(--orange);background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.25);padding:3px 10px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.btn-logout{background:none;border:1px solid var(--b2);color:var(--tx2);font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:var(--font);transition:all .2s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--b1);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.nav-section{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;padding:12px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);cursor:pointer;font-size:13.5px;color:var(--tx2);transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:var(--font)}
.nav-item:hover{background:var(--bg3);color:var(--tx)}
.nav-item.active{background:rgba(90,140,255,.12);color:var(--blue);font-weight:600}
.nav-item .ni{font-size:15px;width:18px;text-align:center}
.main{flex:1;overflow-y:auto;padding:28px 32px}

/* ── LOGIN SCREEN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--bg2);border:1px solid var(--b1);border-radius:16px;padding:40px;width:400px;max-width:calc(100vw - 32px)}
.login-box h1{font-size:22px;font-weight:800;margin-bottom:4px;letter-spacing:-.5px}
.login-box p{color:var(--tx3);font-size:13px;margin-bottom:28px}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.form-row input{width:100%;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);padding:10px 14px;font-size:14px;color:var(--tx);font-family:var(--font);outline:none;transition:border-color .2s}
.form-row input:focus{border-color:var(--blue)}
.btn-primary{width:100%;background:var(--blue);color:#fff;border:none;padding:11px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);transition:opacity .2s;margin-top:8px}
.btn-primary:hover{opacity:.85}
.login-error{color:var(--red);font-size:13px;margin-top:12px;text-align:center;display:none}

/* ── CARDS / STATS ── */
.stats-g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:20px 22px}
.stat-card .sc-label{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.stat-card .sc-val{font-size:30px;font-weight:800;letter-spacing:-1.5px;color:var(--tx)}
.stat-card .sc-sub{font-size:12px;color:var(--tx3);margin-top:4px}

/* ── PAGE HEADER ── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.5px}
.page-subtitle{font-size:13px;color:var(--tx3);margin-top:2px}

/* ── TABLE ── */
.table-wrap{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b1)}
.search-input{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);padding:8px 14px;font-size:13px;color:var(--tx);font-family:var(--font);outline:none;width:260px;transition:border-color .2s}
.search-input:focus{border-color:var(--blue)}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--b1)}
th{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:11px 16px;text-align:left}
td{padding:13px 16px;font-size:13.5px;color:var(--tx2);border-bottom:1px solid rgba(255,255,255,.03)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.03em}
.badge-green{background:rgba(48,209,88,.12);color:var(--green);border:1px solid rgba(48,209,88,.2)}
.badge-blue{background:rgba(90,140,255,.12);color:var(--blue);border:1px solid rgba(90,140,255,.2)}
.badge-orange{background:rgba(255,159,10,.12);color:var(--orange);border:1px solid rgba(255,159,10,.2)}
.badge-red{background:rgba(255,69,58,.12);color:var(--red);border:1px solid rgba(255,69,58,.2)}
.badge-purple{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.2)}
.badge-gray{background:rgba(255,255,255,.06);color:var(--tx3);border:1px solid var(--b1)}
.action-btn{background:none;border:1px solid var(--b1);color:var(--tx2);font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:var(--font);transition:all .2s;margin-right:4px}
.action-btn:hover{border-color:var(--blue);color:var(--blue)}
.action-btn.danger:hover{border-color:var(--red);color:var(--red)}
.action-btn.success:hover{border-color:var(--green);color:var(--green)}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--b2);border-radius:16px;padding:28px;width:480px;max-width:calc(100vw - 32px);max-height:80vh;overflow-y:auto}
.modal h2{font-size:17px;font-weight:800;margin-bottom:4px;letter-spacing:-.4px}
.modal p{font-size:13px;color:var(--tx3);margin-bottom:20px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.btn-cancel{background:none;border:1px solid var(--b2);color:var(--tx2);font-size:13px;padding:8px 18px;border-radius:var(--rs);cursor:pointer;font-family:var(--font);transition:all .2s}
.btn-cancel:hover{border-color:var(--b2);color:var(--tx)}
.btn-confirm{background:var(--blue);color:#fff;border:none;font-size:13px;font-weight:700;padding:8px 18px;border-radius:var(--rs);cursor:pointer;font-family:var(--font);transition:opacity .2s}
.btn-confirm:hover{opacity:.85}
.btn-danger{background:var(--red)!important}

/* ── WORKSPACE DETAIL ── */
.ws-header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.ws-avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0}
.ws-info h2{font-size:19px;font-weight:800;letter-spacing:-.4px}
.ws-info p{font-size:13px;color:var(--tx3);margin-top:2px}
.back-btn{background:none;border:1px solid var(--b1);color:var(--tx2);font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:var(--font);transition:all .2s;display:inline-flex;align-items:center;gap:6px;margin-bottom:20px}
.back-btn:hover{border-color:var(--b2);color:var(--tx)}
.section-card{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);margin-bottom:20px}
.section-card-header{padding:16px 20px;border-bottom:1px solid var(--b1);font-size:14px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;justify-content:space-between}
.section-card-body{padding:20px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:13.5px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--tx3);font-size:12.5px}
.info-val{color:var(--tx);font-weight:500}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--b2);border-radius:10px;padding:12px 20px;font-size:13.5px;color:var(--tx);z-index:999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:340px}
.toast.show{transform:translateY(0);opacity:1}
.toast.toast-ok{border-color:rgba(48,209,88,.3);color:var(--green)}
.toast.toast-err{border-color:rgba(255,69,58,.3);color:var(--red)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .ei{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px}

/* ── LOADING ── */
.loading{text-align:center;padding:40px;color:var(--tx3);font-size:13px}

/* ── TOGGLE ── */
.toggle-wrap{display:flex;align-items:center;gap:10px}
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--b2);border-radius:20px;transition:.3s}
.toggle input:checked + .toggle-slider{background:var(--blue)}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked + .toggle-slider::before{transform:translateX(16px)}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .sidebar{display:none}
  .stats-g{grid-template-columns:repeat(2,1fr)}
  .main{padding:16px}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <div style="font-size:22px;font-weight:800;background:linear-gradient(135deg,#5a8cff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px">VEWIT</div>
    <h1>Admin Panel</h1>
    <p>Super-admin access only. All actions are logged.</p>
    <div class="form-row">
      <label>Admin Email</label>
      <input type="email" id="login-email" placeholder="admin@vewit.in" autocomplete="username"/>
    </div>
    <div class="form-row">
      <label>Admin Password</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="btn-primary" onclick="doLogin()">Sign In to Admin Panel</button>
    <div class="login-error" id="login-err">Invalid credentials</div>
  </div>
</div>

<!-- MAIN APP (hidden until logged in) -->
<div id="app-shell" style="display:none;flex-direction:column;min-height:100vh">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">
      VEWIT
      <span>Admin</span>
    </div>
    <div class="topbar-right">
      <div class="admin-badge">Super Admin</div>
      <div style="font-size:13px;color:var(--tx3)" id="admin-email-display"></div>
      <button class="btn-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div class="layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="nav-section">Overview</div>
      <button class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
        <span class="ni">📊</span> Dashboard
      </button>
      <button class="nav-item" onclick="showPage('workspaces')" id="nav-workspaces">
        <span class="ni">🏢</span> Workspaces
      </button>
      <button class="nav-item" onclick="showPage('users')" id="nav-users">
        <span class="ni">👥</span> All Users
      </button>
      <div class="nav-section">Management</div>
      <button class="nav-item" onclick="showPage('security')" id="nav-security">
        <span class="ni">🔐</span> Security & 2FA
      </button>
      <button class="nav-item" onclick="showPage('pricing')" id="nav-pricing">
        <span class="ni">💳</span> Plans & Billing
      </button>
      <button class="nav-item" onclick="showPage('audit')" id="nav-audit">
        <span class="ni">📋</span> Audit Log
      </button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main" id="main-content">
      <div class="loading">Loading…</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Confirm</h2>
    <p id="modal-body">Are you sure?</p>
    <div id="modal-form"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" id="modal-confirm-btn" onclick="modalConfirm()">Confirm</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let ADMIN_TOKEN = sessionStorage.getItem('vewit_admin_token') || '';
let currentPage = 'dashboard';
let modalCb = null;

// ── Boot ───────────────────────────────────────────────────────────────────────
(function(){
  if (ADMIN_TOKEN) {
    showApp();
    showPage('dashboard');
  }
})();

// ── API ────────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': ADMIN_TOKEN },
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch('/api/admin' + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

// ── Login / Logout ─────────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Login failed'; errEl.style.display='block'; return; }
    ADMIN_TOKEN = data.token;
    sessionStorage.setItem('vewit_admin_token', ADMIN_TOKEN);
    document.getElementById('admin-email-display').textContent = email;
    showApp();
    showPage('dashboard');
  } catch(e) {
    errEl.textContent = 'Connection error'; errEl.style.display='block';
  }
}

function doLogout() {
  ADMIN_TOKEN = '';
  sessionStorage.removeItem('vewit_admin_token');
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';
}

// ── Navigation ─────────────────────────────────────────────────────────────────
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + page);
  if (nav) nav.classList.add('active');
  const pages = { dashboard, workspaces, users, security, pricing, audit };
  if (pages[page]) pages[page]();
}

// ── Toast ──────────────────────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast toast-${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ── Modal ──────────────────────────────────────────────────────────────────────
function openModal(title, body, formHtml, btnLabel, btnClass, cb) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent = body;
  document.getElementById('modal-form').innerHTML = formHtml || '';
  const btn = document.getElementById('modal-confirm-btn');
  btn.textContent = btnLabel || 'Confirm';
  btn.className = 'btn-confirm' + (btnClass ? ' ' + btnClass : '');
  modalCb = cb;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  modalCb = null;
}
async function modalConfirm() {
  if (modalCb) await modalCb();
  closeModal();
}

// ── Render helpers ─────────────────────────────────────────────────────────────
function set(html) { document.getElementById('main-content').innerHTML = html; }

function roleBadge(role) {
  const map = {
    Admin:'badge-red', Manager:'badge-orange', TeamLead:'badge-purple',
    Developer:'badge-blue', Tester:'badge-green', Viewer:'badge-gray'
  };
  return `<span class="badge ${map[role]||'badge-gray'}">${role}</span>`;
}

function planBadge(plan) {
  const map = { starter:'badge-gray', team:'badge-blue', enterprise:'badge-purple' };
  return `<span class="badge ${map[plan]||'badge-gray'}">${plan||'starter'}</span>`;
}

// ══════════════════════════════════════════════════════════════════════════════
// PAGES
// ══════════════════════════════════════════════════════════════════════════════

// ── Dashboard ─────────────────────────────────────────────────────────────────
async function dashboard() {
  set('<div class="loading">Loading dashboard…</div>');
  try {
    const data = await api('GET', '/stats');
    set(`
      <div class="page-header">
        <div>
          <div class="page-title">Dashboard</div>
          <div class="page-subtitle">Platform-wide overview — ${new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
        </div>
      </div>
      <div class="stats-g">
        <div class="stat-card">
          <div class="sc-label">Total Workspaces</div>
          <div class="sc-val">${data.workspaces}</div>
          <div class="sc-sub">Across all companies</div>
        </div>
        <div class="stat-card">
          <div class="sc-label">Total Users</div>
          <div class="sc-val">${data.users}</div>
          <div class="sc-sub">All roles combined</div>
        </div>
        <div class="stat-card">
          <div class="sc-label">Total Tasks</div>
          <div class="sc-val">${data.tasks}</div>
          <div class="sc-sub">Across all projects</div>
        </div>
        <div class="stat-card">
          <div class="sc-label">Active Today</div>
          <div class="sc-val">${data.active_today}</div>
          <div class="sc-sub">Users active last 24h</div>
        </div>
      </div>
      <div class="table-wrap">
        <div class="table-toolbar">
          <div style="font-size:14px;font-weight:700">Recent Workspaces</div>
        </div>
        <table>
          <thead><tr>
            <th>Workspace</th><th>Owner</th><th>Members</th><th>Plan</th><th>Created</th><th>Actions</th>
          </tr></thead>
          <tbody>
            ${(data.recent_workspaces||[]).map(w=>`
              <tr>
                <td><b style="color:var(--tx)">${esc(w.name)}</b><br/><span style="font-size:11px;color:var(--tx3)">${esc(w.id)}</span></td>
                <td>${esc(w.owner_name||'—')}</td>
                <td>${w.member_count||0}</td>
                <td>${planBadge(w.plan)}</td>
                <td style="font-size:12px">${(w.created||'').slice(0,10)}</td>
                <td><button class="action-btn" onclick="viewWorkspace('${esc(w.id)}','${esc(w.name)}')">Manage →</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `);
  } catch(e) { set(`<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`); }
}

// ── Workspaces ────────────────────────────────────────────────────────────────
async function workspaces() {
  set('<div class="loading">Loading workspaces…</div>');
  try {
    const data = await api('GET', '/workspaces');
    set(`
      <div class="page-header">
        <div>
          <div class="page-title">Workspaces</div>
          <div class="page-subtitle">${data.length} workspace(s) registered</div>
        </div>
      </div>
      <div class="table-wrap">
        <div class="table-toolbar">
          <input class="search-input" placeholder="Search workspaces…" oninput="filterTable(this,'ws-table')" />
        </div>
        <table id="ws-table">
          <thead><tr>
            <th>Name</th><th>Invite Code</th><th>Members</th><th>Plan</th><th>2FA</th><th>Created</th><th>Actions</th>
          </tr></thead>
          <tbody>
            ${data.map(w=>`
              <tr data-search="${esc(w.name)} ${esc(w.id)} ${esc(w.invite_code||'')}">
                <td>

async function resetPassword(userId, userName) {
  openModal(
    'Reset Password',
    `Set a new password for ${userName}. They will need to log in with this new password.`,
    `<div class="form-row"><label>New Password</label><input type="password" id="new-pw-input" placeholder="Min 8 characters" /></div>`,
    'Reset Password', '',
    async () => {
      const pw = document.getElementById('new-pw-input').value;
      if (!pw || pw.length < 8) { toast('Password must be at least 8 characters', 'err'); return; }
      try {
        await api('POST', '/user/reset-password', { user_id: userId, password: pw });
        toast(`✓ Password reset for ${userName}`);
      } catch(e) { toast(e.message, 'err'); }
    }
  );
}

async function resetTOTP(userId, userName) {
  openModal(
    'Reset Google Authenticator',
    `This will clear 2FA for ${userName}. They will need to reconfigure Google Authenticator on next login.`,
    '', 'Reset 2FA', '',
    async () => {
      try {
        await api('POST', '/user/reset-totp', { user_id: userId });
        toast(`✓ 2FA reset for ${userName}`);
      } catch(e) { toast(e.message, 'err'); }
    }
  );
}

async function changeRole(userId, userName, currentRole) {
  const roles = ['Admin','Manager','TeamLead','Developer','Tester','Viewer'];
  openModal(
    'Change Role',
    `Change role for ${userName} (currently: ${currentRole})`,
    `<div class="form-row"><label>New Role</label><select id="role-select" style="width:100%;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);padding:10px 14px;font-size:14px;color:var(--tx);font-family:var(--font);outline:none">
      ${roles.map(r=>`<option value="${r}" ${r===currentRole?'selected':''}>${r}</option>`).join('')}
    </select></div>`,
    'Update Role', '',
    async () => {
      const role = document.getElementById('role-select').value;
      try {
        await api('POST', '/user/change-role', { user_id: userId, role });
        toast(`✓ Role updated to ${role} for ${userName}`);
      } catch(e) { toast(e.message, 'err'); }
    }
  );
}

  openModal(
    'Remove User',
    `Remove ${userName} from this workspace? This cannot be undone.`,

    async () => {
      try {
        await api('POST', '/user/remove', { user_id: userId, workspace_id: wsId });

      try {

        toast(`✓ 2FA requirement ${enable ? 'enabled' : 'disabled'}`);

async function addUserToWs(wsId) {
  openModal(
    'Add User to Workspace',
    'Create a new user account directly in this workspace.',
    `<div class="form-row"><label>Name</label><input id="add-name" placeholder="Full name" /></div>
     <div class="form-row"><label>Email</label><input id="add-email" type="email" placeholder="user@company.com" /></div>

       <option>Developer</option><option>Tester</option><option>Viewer</option><option>TeamLead</option><option>Manager</option><option>Admin</option>
     </select></div>`,
    'Create User', '',
    async () => {
      const name = document.getElementById('add-name').value;
      const email = document.getElementById('add-email').value;
      const pw = document.getElementById('add-pw').value;
      const role = document.getElementById('add-role').value;
      if (!name || !email || !pw) { toast('All fields required', 'err'); return; }
      try {
        await api('POST', '/workspace/add-user', { workspace_id: wsId, name, email, password: pw, role });
        toast(`✓ User ${name} created`);
        viewWorkspace(wsId, '');
      } catch(e) { toast(e.message, 'err'); }
    }
  );
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function slugify(s) {
  return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function timeSince(dateStr) {
  const d = new Date(dateStr);
  const sec = Math.floor((Date.now() - d) / 1000);
  if (sec < 60) return 'Just now';
  if (sec < 3600) return `${Math.floor(sec/60)}m ago`;
  if (sec < 86400) return `${Math.floor(sec/3600)}h ago`;
  return `${Math.floor(sec/86400)}d ago`;
}

function filterTable(input, tableId) {
  const q = input.value.toLowerCase();
  document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
    const text = (row.dataset.search || row.textContent).toLowerCase();
    row.style.display = text.includes(q) ? '' : 'none';
  });
}
